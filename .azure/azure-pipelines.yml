# Azure DevOps Pipeline for UAT MSC Portal
# Laravel PHP backend + React TypeScript frontend

trigger:
  branches:
    include:
      - uat-azuredev-integration

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: nodeVersion
    value: '18.x'
  - name: phpVersion
    value: '8.2'
  - name: buildConfiguration
    value: 'production'

  # Non-sensitive environment variables
  - name: APP_NAME
    value: 'MSC Platform'
  - name: APP_ENV
    value: 'uat'
  - name: APP_DEBUG
    value: 'false'
  - name: DB_HOST
    value: 'localhost'
  - name: DB_DATABASE
    value: 'UATDB'
  - name: DB_USERNAME
    value: 'msc_user'
  - name: REDIS_HOST
    value: 'localhost'
  - name: REDIS_PASSWORD
    value: ''
  - name: REDIS_CONNECTION
    value: 'default'
  - name: AZURE_STORAGE_BLOB_URL
    value: ''
  # SESSION_DOMAIN and SANCTUM_STATEFUL_DOMAINS will be computed from APP_ENV
  - name: VITE_PUSHER_APP_KEY
    value: ''
  - name: VITE_PUSHER_APP_CLUSTER
    value: ''

  # FHIR Feature Flags
  - name: FHIR_ENABLED
    value: 'true'
  - name: FHIR_SERVICE_ENABLED
    value: 'true'
  - name: FHIR_PATIENT_HANDLER_ENABLED
    value: 'true'
  - name: FHIR_PROVIDER_HANDLER_ENABLED
    value: 'true'
  - name: FHIR_INSURANCE_HANDLER_ENABLED
    value: 'true'
  - name: FHIR_CLINICAL_HANDLER_ENABLED
    value: 'true'
  - name: FHIR_ORDER_HANDLER_ENABLED
    value: 'true'
  - name: FHIR_DEBUG_MODE
    value: 'false'
  - name: FHIR_EPISODE_CACHE_WARMING_ENABLED
    value: 'true'

  # Database Configuration
  - name: DB_CONNECTION
    value: 'mysql'
  - name: DB_PORT
    value: '3306'
  - name: DB_SSL_REQUIRED
    value: 'OFF'

  # Mail Configuration
  - name: MAIL_MAILER
    value: 'mailgun'
  - name: MAILGUN_ENDPOINT
    value: 'api.mailgun.net'
  - name: VITE_MAIL_FROM_ADDRESS
    value: 'richard@mscwoundcare.com'
  - name: VITE_MAIL_FROM_NAME
    value: 'MSC Wound Care Portal'

  # Cache & Queue
  - name: CACHE_DRIVER
    value: 'redis'
  - name: QUEUE_CONNECTION
    value: 'redis'
  - name: REDIS_PORT
    value: '6380'
  - name: REDIS_DATABASE
    value: '2'

  # File Storage
  - name: FILESYSTEM_DISK
    value: 'azure'

  # API Endpoints
  - name: HEALTH_VOCAB_API_URL
    value: 'http://localhost:8001'
  - name: CMS_API_BASE_URL
    value: 'https://api.coverage.cms.gov/v1'
  - name: CMS_API_CACHE_MINUTES
    value: '60'
  - name: CMS_API_MAX_RETRIES
    value: '3'
  - name: CMS_API_THROTTLE_LIMIT
    value: '9000'
  - name: CMS_API_TIMEOUT
    value: '30'
  - name: DOCUSEAL_API_URL
    value: 'https://api.docuseal.com'
  - name: DOCUSEAL_TIMEOUT
    value: '3000'
  - name: DOCUSEAL_MAX_RETRIES
    value: '3'
  - name: DOCUSEAL_RETRY_DELAY
    value: '1000'
  - name: AVAILITY_API_BASE_URL
    value: 'https://api.availity.com/availity/development-partner/v1'
  - name: AVAILITY_CACHE_ENABLED
    value: 'true'
  - name: AVAILITY_CACHE_TTL
    value: '3600'
  - name: AVAILITY_LOGGING_ENABLED
    value: 'true'
  - name: AVAILITY_LOG_LEVEL
    value: 'info'
  - name: AVAILITY_LOG_REQUEST_BODY
    value: 'false'
  - name: AVAILITY_LOG_RESPONSE_BODY
    value: 'false'

  # Azure AI Foundry Configuration
  - name: AZURE_AI_FOUNDRY_ENABLED
    value: 'true'
  - name: AZURE_OPENAI_DEPLOYMENT_NAME
    value: 'gpt-4o'
  - name: AZURE_OPENAI_API_VERSION
    value: '2025-01-01-preview'
  - name: AZURE_OPENAI_REALTIME_DEPLOYMENT_NAME
    value: 'gpt-4o-mini-realtime-preview'
  - name: AZURE_OPENAI_REALTIME_API_VERSION
    value: '2024-10-01-preview'
  - name: AI_DEFAULT_VOICE
    value: 'en-US-JennyNeural'
  - name: AI_REALTIME_VOICE
    value: 'alloy'
  - name: AZURE_SPEECH_REGION
    value: 'eastus2'
  - name: AZURE_DOCUMENT_INTELLIGENCE_API_VERSION
    value: '2024-11-30'
  - name: AZURE_DI_API_VERSION
    value: '2024-02-29-preview'

  # ECW Integration
  - name: ECW_ENVIRONMENT
    value: 'sandbox'
  # ECW_REDIRECT_URI will be computed from APP_ENV
  - name: ECW_SCOPE
    value: 'uat'

  # Epic Integration
  - name: EPIC_ENVIRONMENT
    value: 'sandbox'
  - name: EPIC_FHIR_BASE_URL
    value: 'https://fhir.epic.com/interconnect-fhir-oauth/api/FHIR/R4'
  - name: EPIC_AUTHORIZATION_ENDPOINT
    value: 'https://fhir.epic.com/interconnect-fhir-oauth/oauth2/authorize'
  - name: EPIC_TOKEN_ENDPOINT
    value: 'https://fhir.epic.com/interconnect-fhir-oauth/oauth2/token'
  - name: EPIC_SCOPE
    value: 'patient/Patient.read patient/Condition.read patient/Observation.read patient/DiagnosticReport.read'
  - name: EPIC_TIMEOUT
    value: '30'

  # Laravel Sanctum
  - name: SESSION_DRIVER
    value: 'redis'
  # Session cookie domains are computed in .env from APP_ENV
  # Insurance AI Assistant Configuration
  - name: AZURE_INSURANCE_ASSISTANT_VOICE_ENABLED
    value: 'true'
  - name: AZURE_INSURANCE_ASSISTANT_MODEL
    value: 'gpt-4o'
  - name: AZURE_INSURANCE_ASSISTANT_TEMPERATURE
    value: '0.7'
  - name: AZURE_INSURANCE_ASSISTANT_MAX_TOKENS
    value: '2000'
  - name: AZURE_INSURANCE_ASSISTANT_CONTEXT_WINDOW
    value: '8000'
  - name: AZURE_INSURANCE_ASSISTANT_SYSTEM_PROMPT
    value: 'You are an insurance AI assistant specialized in wound care insurance verification and form assistance with access to extensive manufacturer field mappings and ML-enhanced recommendations.'
  - name: AZURE_INSURANCE_ASSISTANT_TRAINING_VERSION
    value: '2024-11-20'
  - name: AZURE_INSURANCE_ASSISTANT_CACHE_TTL
    value: '3600'
  - name: AZURE_INSURANCE_ASSISTANT_ML_ENHANCEMENT
    value: 'true'
  - name: AZURE_INSURANCE_ASSISTANT_MANUFACTURER_CONTEXT
    value: 'true'
  - name: AZURE_INSURANCE_ASSISTANT_BEHAVIORAL_TRACKING
    value: 'true'

  # Variable groups for sensitive data (create these in Azure DevOps Library)
  - group: msc-woundcare-portal-secrets-uat
  - group: msc-woundcare-portal-azure-config-uat

stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: BuildAndTest
    displayName: 'Build Frontend and Backend'
    steps:

    # Setup Node.js for React frontend
    # Minimum required Node.js version for React/TypeScript frontend: 18.x
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'
      displayName: 'Install Node.js $(nodeVersion)'

  # Setup PHP for Laravel backend
    - script: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:ondrej/php
        sudo apt-get update
        sudo apt-get install -y \
          php$(phpVersion) \
          php$(phpVersion)-cli \
          php$(phpVersion)-common \
          php$(phpVersion)-mysql \
          php$(phpVersion)-xml \
          php$(phpVersion)-curl \
          php$(phpVersion)-gd \
          php$(phpVersion)-imagick \
          php$(phpVersion)-dev \
          php$(phpVersion)-imap \
          php$(phpVersion)-mbstring \
          php$(phpVersion)-opcache \
          php$(phpVersion)-soap \
          php$(phpVersion)-zip \
          php$(phpVersion)-redis \
          php$(phpVersion)-intl \
          php$(phpVersion)-bcmath
        php -v
      displayName: 'Setup PHP $(phpVersion)'

    # Install Composer
    - script: |
        php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
        php composer-setup.php --install-dir=/usr/local/bin --filename=composer
        composer --version
      displayName: 'Install Composer'

    # Cache Node modules
    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: '$(System.DefaultWorkingDirectory)/node_modules'
      displayName: 'Cache Node modules'

    # Cache Composer dependencies
    - task: Cache@2
      inputs:
        key: 'composer | "$(Agent.OS)" | composer.lock'
        restoreKeys: |
          composer | "$(Agent.OS)"
        path: '$(System.DefaultWorkingDirectory)/vendor'
      displayName: 'Cache Composer dependencies'

    # Install Node dependencies
    - script: npm ci
      displayName: 'Install Node dependencies'

    # Install Composer dependencies
    - script: |
        composer install --no-dev --optimize-autoloader --no-interaction
      displayName: 'Install Composer dependencies'

    # Create .env file for build and deployment
    - script: |
        set -e
        # Compute domain based on APP_ENV (e.g., uat -> uat.mscwound.com)
        APP_ENV_LC="$(printf %s "$APP_ENV" | tr '[:upper:]' '[:lower:]')"
        APP_HOST="${APP_ENV_LC}.mscwound.com"
        APP_URL_COMPUTED="https://${APP_HOST}"
        SESSION_DOMAIN_COMPUTED=".${APP_HOST}"
        SANCTUM_STATEFUL_DOMAINS_COMPUTED="${APP_HOST}"
        ECW_REDIRECT_URI_COMPUTED="${APP_URL_COMPUTED}/api/ecw/callback"

        # Create/overwrite .env cleanly
        : > .env

        # Application Configuration
        printf "APP_NAME=%s\n" "${APP_NAME}" >> .env
        printf "APP_ENV=%s\n" "${APP_ENV}" >> .env
        printf "APP_DEBUG=%s\n" "${APP_DEBUG}" >> .env
        printf "APP_KEY=\n" >> .env
        printf "APP_URL=%s\n" "${APP_URL_COMPUTED}" >> .env

        # FHIR Configuration
        printf "FHIR_ENABLED=%s\n" "${FHIR_ENABLED}" >> .env
        printf "FHIR_SERVICE_ENABLED=%s\n" "${FHIR_SERVICE_ENABLED}" >> .env
        printf "FHIR_PATIENT_HANDLER_ENABLED=%s\n" "${FHIR_PATIENT_HANDLER_ENABLED}" >> .env
        printf "FHIR_PROVIDER_HANDLER_ENABLED=%s\n" "${FHIR_PROVIDER_HANDLER_ENABLED}" >> .env
        printf "FHIR_INSURANCE_HANDLER_ENABLED=%s\n" "${FHIR_INSURANCE_HANDLER_ENABLED}" >> .env
        printf "FHIR_CLINICAL_HANDLER_ENABLED=%s\n" "${FHIR_CLINICAL_HANDLER_ENABLED}" >> .env
        printf "FHIR_ORDER_HANDLER_ENABLED=%s\n" "${FHIR_ORDER_HANDLER_ENABLED}" >> .env
        printf "FHIR_DEBUG_MODE=%s\n" "${FHIR_DEBUG_MODE}" >> .env
        printf "FHIR_EPISODE_CACHE_WARMING_ENABLED=%s\n" "${FHIR_EPISODE_CACHE_WARMING_ENABLED}" >> .env

        # Azure FHIR Configuration
        printf "AZURE_FHIR_CLIENT_ID=%s\n" "${AZURE_FHIR_CLIENT_ID}" >> .env
        printf "AZURE_FHIR_CLIENT_SECRET=%s\n" "${AZURE_FHIR_CLIENT_SECRET}" >> .env
        printf "AZURE_FHIR_TENANT_ID=%s\n" "${AZURE_FHIR_TENANT_ID}" >> .env
        printf "AZURE_FHIR_BASE_URL=%s\n" "${AZURE_FHIR_BASE_URL}" >> .env
        printf "AZURE_FHIR_SCOPE=%s\n" "${AZURE_FHIR_SCOPE}" >> .env
        printf "AZURE_FHIR_AUTHORITY=%s\n" "${AZURE_FHIR_AUTHORITY}" >> .env
        printf "AZURE_FHIR_ENDPOINT=%s\n" "${AZURE_FHIR_ENDPOINT}" >> .env

        # Database Configuration
        printf "DB_CONNECTION=%s\n" "${DB_CONNECTION}" >> .env
        printf "DB_HOST=%s\n" "${DB_HOST}" >> .env
        printf "DB_PORT=%s\n" "${DB_PORT}" >> .env
        printf "DB_DATABASE=%s\n" "${DB_DATABASE}" >> .env
        printf "DB_USERNAME=%s\n" "${DB_USERNAME}" >> .env
        printf "DB_PASSWORD=%s\n" "${DB_PASSWORD}" >> .env
        printf "DB_SSL_REQUIRED=%s\n" "${DB_SSL_REQUIRED}" >> .env

        # Mail Configuration
        printf "MAIL_MAILER=%s\n" "${MAIL_MAILER}" >> .env
        printf "MAILGUN_DOMAIN=%s\n" "${MAILGUN_DOMAIN}" >> .env
        printf "MAILGUN_SECRET=%s\n" "${MAILGUN_SECRET}" >> .env
        printf "MAILGUN_ENDPOINT=%s\n" "${MAILGUN_ENDPOINT}" >> .env
        printf "MAILGUN_WEBHOOK_SIGNING_SECRET=%s\n" "${MAILGUN_WEBHOOK_SIGNING_SECRET}" >> .env
        printf "VITE_MAIL_FROM_ADDRESS=%s\n" "${VITE_MAIL_FROM_ADDRESS}" >> .env
        printf "VITE_MAIL_FROM_NAME=%s\n" "${VITE_MAIL_FROM_NAME}" >> .env

        # Cache & Queue Configuration
        printf "CACHE_DRIVER=%s\n" "${CACHE_DRIVER}" >> .env
        printf "QUEUE_CONNECTION=%s\n" "${QUEUE_CONNECTION}" >> .env
        printf "REDIS_HOST=%s\n" "${REDIS_HOST}" >> .env
        printf "REDIS_PASSWORD=%s\n" "${REDIS_PASSWORD}" >> .env
        printf "REDIS_PORT=%s\n" "${REDIS_PORT}" >> .env
        printf "REDIS_DATABASE=%s\n" "${REDIS_DATABASE}" >> .env
        printf "REDIS_CONNECTION=%s\n" "${REDIS_CONNECTION}" >> .env

        # File Storage
        printf "FILESYSTEM_DISK=%s\n" "${FILESYSTEM_DISK}" >> .env
        printf "AZURE_STORAGE_BLOB_URL=%s\n" "${AZURE_STORAGE_BLOB_URL}" >> .env

        # API Configuration
        printf "HEALTH_VOCAB_API_URL=%s\n" "${HEALTH_VOCAB_API_URL}" >> .env
        printf "UMLS_API_KEY=%s\n" "${UMLS_API_KEY}" >> .env
        printf "CMS_API_BASE_URL=%s\n" "${CMS_API_BASE_URL}" >> .env
        printf "CMS_API_CACHE_MINUTES=%s\n" "${CMS_API_CACHE_MINUTES}" >> .env
        printf "CMS_API_MAX_RETRIES=%s\n" "${CMS_API_MAX_RETRIES}" >> .env
        printf "CMS_API_THROTTLE_LIMIT=%s\n" "${CMS_API_THROTTLE_LIMIT}" >> .env
        printf "CMS_API_TIMEOUT=%s\n" "${CMS_API_TIMEOUT}" >> .env

        # DocuSeal Configuration
        printf "DOCUSEAL_API_URL=%s\n" "${DOCUSEAL_API_URL}" >> .env
        printf "DOCUSEAL_API_KEY=%s\n" "${DOCUSEAL_API_KEY}" >> .env
        printf "DOCUSEAL_WEBHOOK_SECRET=%s\n" "${DOCUSEAL_WEBHOOK_SECRET}" >> .env
        printf "DOCUSEAL_TIMEOUT=%s\n" "${DOCUSEAL_TIMEOUT}" >> .env
        printf "DOCUSEAL_MAX_RETRIES=%s\n" "${DOCUSEAL_MAX_RETRIES}" >> .env
        printf "DOCUSEAL_RETRY_DELAY=%s\n" "${DOCUSEAL_RETRY_DELAY}" >> .env

        # Availity Configuration
        printf "AVAILITY_API_BASE_URL=%s\n" "${AVAILITY_API_BASE_URL}" >> .env
        printf "AVAILITY_CLIENT_ID=%s\n" "${AVAILITY_CLIENT_ID}" >> .env
        printf "AVAILITY_CLIENT_SECRET=%s\n" "${AVAILITY_CLIENT_SECRET}" >> .env
        printf "AVAILITY_CACHE_ENABLED=%s\n" "${AVAILITY_CACHE_ENABLED}" >> .env
        printf "AVAILITY_CACHE_TTL=%s\n" "${AVAILITY_CACHE_TTL}" >> .env
        printf "AVAILITY_LOGGING_ENABLED=%s\n" "${AVAILITY_LOGGING_ENABLED}" >> .env
        printf "AVAILITY_LOG_LEVEL=%s\n" "${AVAILITY_LOG_LEVEL}" >> .env
        printf "AVAILITY_LOG_REQUEST_BODY=%s\n" "${AVAILITY_LOG_REQUEST_BODY}" >> .env
        printf "AVAILITY_LOG_RESPONSE_BODY=%s\n" "${AVAILITY_LOG_RESPONSE_BODY}" >> .env

        # Azure Services Configuration
        printf "AZURE_AISERVICES_COGNITIVESERVICES_ENDPOINT=%s\n" "${AZURE_AISERVICES_COGNITIVESERVICES_ENDPOINT}" >> .env
        printf "AZURE_AISERVICES_OPENAI_BASE=%s\n" "${AZURE_AISERVICES_OPENAI_BASE}" >> .env
        printf "AZURE_SPEECH_ENDPOINT=%s\n" "${AZURE_SPEECH_ENDPOINT}" >> .env
        printf "AZURE_SPEECH_KEY=%s\n" "${AZURE_SPEECH_KEY}" >> .env
        printf "AZURE_SPEECH_REGION=%s\n" "${AZURE_SPEECH_REGION}" >> .env
        printf "AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=%s\n" "${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}" >> .env
        printf "AZURE_DOCUMENT_INTELLIGENCE_KEY=%s\n" "${AZURE_DOCUMENT_INTELLIGENCE_KEY}" >> .env
        printf "AZURE_DOCUMENT_INTELLIGENCE_API_VERSION=%s\n" "${AZURE_DOCUMENT_INTELLIGENCE_API_VERSION}" >> .env
        printf "AZURE_DI_ENDPOINT=%s\n" "${AZURE_DI_ENDPOINT}" >> .env
        printf "AZURE_DI_KEY=%s\n" "${AZURE_DI_KEY}" >> .env
        printf "AZURE_DI_API_VERSION=%s\n" "${AZURE_DI_API_VERSION}" >> .env

        # Azure AI Foundry Configuration
        printf "AZURE_AI_FOUNDRY_ENABLED=%s\n" "${AZURE_AI_FOUNDRY_ENABLED}" >> .env
        printf "AZURE_OPENAI_ENDPOINT=%s\n" "${AZURE_OPENAI_ENDPOINT}" >> .env
        printf "AZURE_OPENAI_API_KEY=%s\n" "${AZURE_OPENAI_API_KEY}" >> .env
        printf "AZURE_OPENAI_DEPLOYMENT_NAME=%s\n" "${AZURE_OPENAI_DEPLOYMENT_NAME}" >> .env
        printf "AZURE_OPENAI_API_VERSION=%s\n" "${AZURE_OPENAI_API_VERSION}" >> .env
        printf "AZURE_OPENAI_REALTIME_DEPLOYMENT_NAME=%s\n" "${AZURE_OPENAI_REALTIME_DEPLOYMENT_NAME}" >> .env
        printf "AZURE_OPENAI_REALTIME_API_VERSION=%s\n" "${AZURE_OPENAI_REALTIME_API_VERSION}" >> .env
        printf "AI_DEFAULT_VOICE=%s\n" "${AI_DEFAULT_VOICE}" >> .env
        printf "AI_REALTIME_VOICE=%s\n" "${AI_REALTIME_VOICE}" >> .env

        # ECW Integration
        printf "ECW_CLIENT_ID=%s\n" "${ECW_CLIENT_ID}" >> .env
        printf "ECW_CLIENT_SECRET=%s\n" "${ECW_CLIENT_SECRET}" >> .env
        printf "ECW_ENVIRONMENT=%s\n" "${ECW_ENVIRONMENT}" >> .env
        printf "ECW_REDIRECT_URI=%s\n" "${ECW_REDIRECT_URI_COMPUTED}" >> .env
        printf "ECW_SCOPE=%s\n" "${ECW_SCOPE}" >> .env

        # Epic Integration
        printf "EPIC_CLIENT_ID=%s\n" "${EPIC_CLIENT_ID}" >> .env
        printf "EPIC_CLIENT_SECRET=%s\n" "${EPIC_CLIENT_SECRET}" >> .env
        printf "EPIC_ENVIRONMENT=%s\n" "${EPIC_ENVIRONMENT}" >> .env
        printf "EPIC_FHIR_BASE_URL=%s\n" "${EPIC_FHIR_BASE_URL}" >> .env
        printf "EPIC_AUTHORIZATION_ENDPOINT=%s\n" "${EPIC_AUTHORIZATION_ENDPOINT}" >> .env
        printf "EPIC_TOKEN_ENDPOINT=%s\n" "${EPIC_TOKEN_ENDPOINT}" >> .env
        printf "EPIC_SCOPE=%s\n" "${EPIC_SCOPE}" >> .env
        printf "EPIC_TIMEOUT=%s\n" "${EPIC_TIMEOUT}" >> .env

        # Laravel Sanctum Configuration
        printf "SESSION_DOMAIN=%s\n" "${SESSION_DOMAIN_COMPUTED}" >> .env
        printf "SESSION_DRIVER=%s\n" "${SESSION_DRIVER}" >> .env
        printf "SESSION_LIFETIME=%s\n" "${SESSION_LIFETIME}" >> .env
        printf "SESSION_SECURE_COOKIE=%s\n" "${SESSION_SECURE_COOKIE}" >> .env
        printf "SANCTUM_STATEFUL_DOMAINS=%s\n" "${SANCTUM_STATEFUL_DOMAINS_COMPUTED}" >> .env

        # Additional API Keys
        printf "SUPERINTEREFACE_API_KEY=%s\n" "${SUPERINTEREFACE_API_KEY}" >> .env
        printf "FIRECRAWL_API_KEY=%s\n" "${FIRECRAWL_API_KEY}" >> .env

        # Insurance AI Assistant Configuration
        printf "AZURE_INSURANCE_ASSISTANT_ID=%s\n" "${AZURE_INSURANCE_ASSISTANT_ID}" >> .env
        printf "AZURE_INSURANCE_ASSISTANT_VOICE_ENABLED=%s\n" "${AZURE_INSURANCE_ASSISTANT_VOICE_ENABLED}" >> .env
        printf "AZURE_INSURANCE_ASSISTANT_MODEL=%s\n" "${AZURE_INSURANCE_ASSISTANT_MODEL}" >> .env
        printf "AZURE_INSURANCE_ASSISTANT_TEMPERATURE=%s\n" "${AZURE_INSURANCE_ASSISTANT_TEMPERATURE}" >> .env
        printf "AZURE_INSURANCE_ASSISTANT_MAX_TOKENS=%s\n" "${AZURE_INSURANCE_ASSISTANT_MAX_TOKENS}" >> .env
        printf "AZURE_INSURANCE_ASSISTANT_CONTEXT_WINDOW=%s\n" "${AZURE_INSURANCE_ASSISTANT_CONTEXT_WINDOW}" >> .env
        printf "AZURE_INSURANCE_ASSISTANT_SYSTEM_PROMPT=%s\n" "${AZURE_INSURANCE_ASSISTANT_SYSTEM_PROMPT}" >> .env
        printf "AZURE_INSURANCE_ASSISTANT_TRAINING_VERSION=%s\n" "${AZURE_INSURANCE_ASSISTANT_TRAINING_VERSION}" >> .env
        printf "AZURE_INSURANCE_ASSISTANT_CACHE_TTL=%s\n" "${AZURE_INSURANCE_ASSISTANT_CACHE_TTL}" >> .env
        printf "AZURE_INSURANCE_ASSISTANT_ML_ENHANCEMENT=%s\n" "${AZURE_INSURANCE_ASSISTANT_ML_ENHANCEMENT}" >> .env
        printf "AZURE_INSURANCE_ASSISTANT_MANUFACTURER_CONTEXT=%s\n" "${AZURE_INSURANCE_ASSISTANT_MANUFACTURER_CONTEXT}" >> .env
        printf "AZURE_INSURANCE_ASSISTANT_BEHAVIORAL_TRACKING=%s\n" "${AZURE_INSURANCE_ASSISTANT_BEHAVIORAL_TRACKING}" >> .env

        # Vite Configuration
        printf "VITE_APP_NAME=%s\n" "${APP_NAME}" >> .env
        printf "VITE_PUSHER_APP_KEY=%s\n" "${VITE_PUSHER_APP_KEY}" >> .env
        printf "VITE_PUSHER_APP_CLUSTER=%s\n" "${VITE_PUSHER_APP_CLUSTER}" >> .env

        echo ".env file created successfully"
      displayName: 'Create environment file'

    # Generate Laravel app key (writes into .env created above)
    - script: |
        php artisan key:generate --force
        grep APP_KEY .env || true
      displayName: 'Generate Laravel application key'

    # TypeScript type checking
    - script: npm run type-check
      displayName: 'TypeScript type checking'

    # ESLint checking
    - script: npm run lint
      displayName: 'ESLint checking'

    # Build React frontend with Vite
    - script: npm run build
      displayName: 'Build React frontend'

    # Run JavaScript/TypeScript tests
    - script: npm run test:coverage
      displayName: 'Run frontend tests'

    # Publish test results
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/junit.xml'
        testRunTitle: 'Frontend Tests'
      displayName: 'Publish frontend test results'

    # Publish code coverage
    - task: PublishCodeCoverageResults@2
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: '**/coverage/cobertura-coverage.xml'
      displayName: 'Publish code coverage'

    # Optimize Laravel for production
    - script: |
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache
      displayName: 'Optimize Laravel'

    # Clean up development files
    - script: |
        rm -rf node_modules
        rm -rf tests
        rm -f .env.example
        rm -f webpack.mix.js
      displayName: 'Clean up dev files'

    # Create deployment package
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/uat-msc-portal.zip'
        replaceExistingArchive: true
      displayName: 'Create deployment package'

    # Publish build artifacts
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'uat-msc-portal-build'
      displayName: 'Publish build artifacts'

- stage: Deploy
  displayName: 'Deploy to UAT'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployUAT
    displayName: 'Deploy to UAT App Service'
    environment: 'UAT'
    strategy:
      runOnce:
        deploy:
          steps:
          # Download build artifacts
          - task: DownloadPipelineArtifact@1
            inputs:
              artifactName: 'uat-msc-portal-build'
              targetPath: '$(Pipeline.Workspace)/uat-msc-portal-build'
            displayName: 'Download build artifacts'

          # Deploy zipped package to Azure App Service (Linux)
          - task: AzureWebApp@1
            displayName: 'Deploy to UAT App Service'
            inputs:
              azureSubscription: 'Azure-Service-Connection'  # Replace with your service connection name
              appType: 'webAppLinux'
              appName: 'uat-msc-portal'  # Replace with your UAT app service name
              package: '$(Pipeline.Workspace)/uat-msc-portal-build/uat-msc-portal.zip'
              runtimeStack: 'PHP|8.2'

          # Run post-deployment tasks via Kudu (optional)
          - task: AzureCLI@2
            displayName: 'Post-deployment tasks'
            inputs:
              azureSubscription: 'Azure-Service-Connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Running post-deployment artisan commands via Kudu"
